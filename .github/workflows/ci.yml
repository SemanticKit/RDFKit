name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Build and test on Linux
    runs-on: ubuntu-latest
    container: swift:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build --build-tests

      - name: Generated Swift stores properties as members
        # RDFTranslatorPlugin writes the Swift the RDF describes under
        # .build/plugins/outputs. Each property is a stored member of the
        # classes of the things that have it, never a lookup in a list of
        # (property, value) statements (DESIGN-CONTRACT.md, rules 1 and 11).
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(.build/plugins/outputs/**/*.swift)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No generated Swift under .build/plugins/outputs"
            exit 1
          fi
          echo "Checking ${#files[@]} generated Swift files"
          if grep -nF 'propertyValues[' "${files[@]}"; then
            echo "::error::Generated Swift looks property values up by property (see the lines above)"
            exit 1
          fi

      - name: Test
        run: swift test
