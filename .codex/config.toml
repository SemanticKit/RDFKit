
[mcp_servers.git]
command = "npx"
args = [ "-y", "@selfagency/git-mcp" ]
enabled = true

[mcp_servers.git.env]
GIT_REPO_PATH = "${workspaceFolder}"

[mcp_servers.git.tools.git_commits]
approval_mode = "approve"

[mcp_servers.git.tools.git_workflow]
approval_mode = "approve"


[mcp_servers.datetime]
command = "/Volumes/Projects/DateTimeMCPServer/.build/arm64-apple-macosx/debug/DateTimeMCPServer"
enabled = true


[mcp_servers.webwatch]
command = "npx"
args = [ "-y", "webwatch-mcp", "mcp" ]
enabled = false


[mcp_servers.obsidian]
command = "obsidian-mcp-server"
enabled = true

[mcp_servers.obsidian.env]
OBSIDIAN_API_KEY = "61af772b183333fbe10be9ae77891359a11be6715dc666af7e2735a2c2d53a34"


[mcp_servers.ckan]
url = "https://ckan-mcp-server.andy-pr.workers.dev/mcp"
enabled = true


[mcp_servers.sosumi]
url = "https://sosumi.ai/mcp"
enabled = false


[mcp_servers.fetch]
args = [ "-y", "mcp-fetch-server" ]
command = "npx"
enabled = true


[mcp_servers.lsp]
args = [ "swift:sourcekit-lsp", "c:clangd", "cpp:clangd" ]
command = "agent-lsp"
enabled = true


[mcp_servers.playwright]
args = [ "-y", "@playwright/mcp@latest" ]
command = "npx"
enabled = true


[mcp_servers.sequential-thinking]
args = [ "-y", "@modelcontextprotocol/server-sequential-thinking" ]
command = "npx"
enabled = true


[mcp_servers.filesystem]
args = [ "-y", "@modelcontextprotocol/server-filesystem", ".", "/Users/me/.codex/attachments", "/Users/me/Library/Developer/XcodeBuildMCP", "/Users/me/.agents/skills" ]
command = "npx"
enabled = true


[mcp_servers.tasks]
command = "/Users/me/.local/bin/Tasks"
args = ["mcp", "--stdio"]
enabled = true

[mcp_servers.pdf-extract]
command = "/Users/me/.local/bin/PDFExtract"
args = ["mcp", "--stdio"]
enabled = true


[mcp_servers.server-pdf]
args = [ "-y", "@modelcontextprotocol/server-pdf", "--stdio", "--use-client-roots" ]
command = "npx"
enabled = true

[mcp_servers.server-memory]
args = [ "-y", "@modelcontextprotocol/server-memory" ]
command = "npx"
enabled = true

[mcp_servers.xcodebuildmcp]
args = [ "-y", "xcodebuildmcp@latest", "mcp" ]
command = "npx"
enabled = true
